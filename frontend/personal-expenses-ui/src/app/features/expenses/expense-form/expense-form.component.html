<form class="card form-grid" (ngSubmit)="submit()">
  <label>Date<input type="date" [(ngModel)]="draft.date" name="date" required></label>
  <label>Amount<input type="number" min="0.01" step="0.01" [(ngModel)]="draft.amount" name="amount" required></label>
  <label>Category<input [(ngModel)]="draft.category" name="category" placeholder="e.g. Groceries" required></label>
  <div class="actions">
    <button [disabled]="submitting">{{ expense ? 'Save changes' : 'Add expense' }}</button>
    <button type="button" class="secondary" *ngIf="expense" (click)="cancelled.emit()">Cancel</button>
  </div>
</form>
