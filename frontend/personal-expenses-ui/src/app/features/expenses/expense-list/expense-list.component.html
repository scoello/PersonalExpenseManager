<div class="card table-card">
  <table>
    <thead><tr><th>Date</th><th>Category</th><th>Amount</th><th>Actions</th></tr></thead>
    <tbody>
      <tr *ngFor="let expense of expenses; trackBy: trackById">
        <td>{{ expense.date | date:'mediumDate' }}</td>
        <td><span class="pill">{{ expense.category }}</span></td>
        <td>{{ expense.amount | currency }}</td>
        <td class="row-actions">
          <button type="button" class="link" (click)="editRequested.emit(expense)">Edit</button>
          <button type="button" class="link danger" (click)="deleteRequested.emit(expense)">Delete</button>
        </td>
      </tr>
      <tr *ngIf="!expenses.length"><td colspan="4" class="empty">No expenses yet. Add your first one above.</td></tr>
    </tbody>
  </table>
</div>
